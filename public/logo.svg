<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Octagon stop sign shape -->
  <polygon
    points="70,14 130,14 186,70 186,130 130,186 70,186 14,130 14,70"
    fill="#EC4E20"
    stroke="#353531"
    stroke-width="6"
  />
  <!-- Inner ring -->
  <polygon
    points="72,24 128,24 176,72 176,128 128,176 72,176 24,128 24,72"
    fill="none"
    stroke="rgba(255,255,255,0.3)"
    stroke-width="3"
  />
  <!-- Hand icon (stop gesture) -->
  <g transform="translate(100,72)" fill="white" opacity="0.15">
    <rect x="-22" y="-28" width="44" height="52" rx="6"/>
  </g>
  <!-- BASTA text -->
  <text
    x="100"
    y="115"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="Fredoka, Arial Rounded MT Bold, Arial, sans-serif"
    font-weight="600"
    font-size="46"
    letter-spacing="2"
    fill="white"
  >BASTA</text>
  <!-- Exclamation dots as accent -->
  <circle cx="58" cy="100" r="5" fill="#FF9505" opacity="0.9"/>
  <circle cx="142" cy="100" r="5" fill="#FF9505" opacity="0.9"/>
</svg>
